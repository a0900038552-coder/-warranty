<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="../care/icon-32.png?v=2">
<title>預約看機｜復原者手機維修</title>
<style>
:root{--ink:#16181d;--red:#d71920;--mute:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--green:#15803d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:110px}
header{background:var(--ink);color:#fff;padding:16px 18px 14px;border-bottom:4px solid var(--red)}
header small{display:block;color:#a1a6b0;font-size:12px;letter-spacing:2px}
header h1{font-size:21px;font-weight:900;letter-spacing:1px;margin-top:2px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:16px;background:var(--red);border-radius:2px}
.prod{display:flex;gap:12px;align-items:flex-start}
.prod img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#eee;flex:none}
.prod .nm{font-size:17px;display:block;font-weight:800}
.price{font-size:22px;font-weight:900;color:var(--red)}
.mute{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-top:1px solid #f0f0f0;vertical-align:top}
td:first-child{color:var(--mute);width:42%}
td:last-child{text-align:right}
td.bad{color:var(--red);font-weight:700}
ol,ul{padding-left:20px}li{margin:3px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #d1d5db;border-radius:12px;padding:12px;margin-top:8px;cursor:pointer;background:#fff}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--red);flex:none}
.opt.on{border-color:var(--red);background:#fff5f5}
.opt b{display:block}
label.f{display:block;font-size:13px;font-weight:700;color:#374151;margin:10px 0 5px}
input.t{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px;font:inherit;background:#fff}
.agree{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.agree input{width:22px;height:22px;accent-color:var(--red);flex:none;margin-top:1px}
.err{color:var(--red);font-size:14px;font-weight:700;margin-top:8px;min-height:1em}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.bar button,.btn{display:block;width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-size:17px;font-weight:900;background:var(--red);color:#fff;letter-spacing:1px;text-align:center;text-decoration:none;cursor:pointer}
.btn.dark{background:var(--ink)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid #d1d5db}
.bar button:disabled{background:#9ca3af}
.big{text-align:center;padding:30px 16px}
.big .ok{width:68px;height:68px;border-radius:50%;background:var(--green);color:#fff;font-size:36px;line-height:68px;margin:0 auto 12px}
.pay{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin-top:10px;text-align:left}
.pay img{display:block;width:220px;max-width:100%;margin:8px auto}
.slot{display:inline-block;border:1.5px solid #d1d5db;border-radius:10px;padding:8px 12px;margin:4px 6px 0 0;background:#fff;font:inherit;font-size:14px;cursor:pointer}
.slot.on{border-color:var(--red);background:#fff5f5;color:var(--red);font-weight:800}
.status{display:inline-block;border-radius:99px;padding:2px 12px;font-weight:800;font-size:13px;background:#fff4d6;color:#a16207}
.sig{display:none}
@media print{
  body{background:#fff;padding:0;font-size:12px}header{background:#fff;color:#000;border-bottom:3px solid var(--red)}header small{color:#555}
  .bar,.np{display:none!important}.card{border:1px solid #ccc;break-inside:avoid;padding:10px;margin-bottom:8px}
  .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}.sig div{border-top:1px solid #000;padding-top:4px}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<header><small>復原者手機維修・中古機</small><h1 id="title">預約看機</h1></header>
<main id="m"><div class="card big"><p class="mute">讀取中…</p></div></main>
<div class="bar hidden" id="bar" style="display:none"><button id="go">確認預約</button></div>

<script>
const GAS = 'https://script.google.com/macros/s/AKfycbxBK7c2Oledgo-jT-kRnueuU8grZxVinuocyp2iLI8u-c5Q94fZSeiemH0UkeAqdjfTlw/exec';
const P = new URLSearchParams(location.search), T = (P.get('t') || '').replace(/\W/g, ''), K = (P.get('k') || '').replace(/\W/g, '');
const $ = id => document.getElementById(id), m = $('m');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US');
const photo = id => 'https://lh3.googleusercontent.com/d/' + id + '=w400';
const CHECK = [['ver', '銷售國家版本'], ['carrier', '是否有電信業者鎖定'], ['account', 'iCloud／Google 帳號已退出'], ['orig', '原廠保固到期時間'], ['look', '螢幕外觀'],
  ['screen', '螢幕功能狀況'], ['touch', '觸控狀況'], ['battery', '電池健康度'], ['grade', '機身新舊程度'], ['bio', '臉部／指紋辨識'], ['cell', '4G／5G 網路'], ['wifi', 'Wi-Fi'],
  ['bt', '藍牙'], ['fcam', '前鏡頭拍照'], ['rcam', '後鏡頭拍照'], ['btn', '機身所有按鈕'], ['spk', '喇叭和聽筒'], ['mic', '麥克風錄音'], ['port', '充電口'], ['qi', '無線充電'],
  ['nfc', 'NFC'], ['prox', '距離感應'], ['light', '自動亮度感應']];

function checkCard(c, imei) {
  if (!c || !Object.keys(c).length) return `<div class="card"><h2>檢測報告</h2><p class="mute">這台的檢測報告整理中，到店時會現場驗機給您看。</p></div>`;
  const rows = [['IMEI', imei ? imei + '<div class="mute" style="font-size:11px">部分號碼以 * 隱藏，取機時用「*#06#」核對完整號碼</div>' : '—'],
    ...CHECK.filter(([k]) => c[k]).map(([k, l]) => [l, esc(k === 'battery' ? String(c[k]).replace(/%$/, '') + '%' : c[k])])];
  return `<div class="card"><h2>檢測報告</h2><table>${rows.map(([l, v]) => `<tr><td>${l}</td><td class="${v === '異常' ? 'bad' : ''}">${v}</td></tr>`).join('')}</table>
    ${c.memo ? `<p style="margin-top:8px"><b>其他說明：</b>${esc(c.memo)}</p>` : ''}<p class="mute" style="margin-top:6px">驗機日期：${esc(c.date || '')}</p></div>`;
}
function visitFlowCard() {
  return `<div class="card"><h2>看機流程</h2><ol>
    <li><b>預約</b>：選到店日期和時間，<b>不用付訂金</b>。機子會幫您保留到預約當天營業結束。</li>
    <li><b>到店驗機</b>：用「*#06#」核對 IMEI，親自檢查外觀與功能，有任何問題現場都可以問。</li>
    <li><b>滿意再購買</b>：在門市簽署商品確認書、付款後交機。不滿意不用買，也不收任何費用。</li>
    <li><b>加購配件</b>：交機時確認，有現貨當場給；需調貨的到貨後郵寄或到店取件。</li>
    <li><b>售後保固</b>：本店保固 30 天，可加購 Repair CARE+ 延長保固。</li></ol></div>`;
}
function visitNoteCard() {
  return `<div class="card"><h2>注意事項</h2><ol>
    <li>線上預約只是<b>保留看機時段</b>，買賣於門市驗機並簽署商品確認書後才成立。</li>
    <li>中古商品：照片與檢測報告為驗機當時狀況，外觀以實機為準。</li>
    <li>只限門市交機，手機不提供寄送。</li>
    <li>預約當天營業結束前沒有到店，保留會自動取消；時間要改或不來了，回覆 LINE 告訴我們就好。</li>
    <li>每台僅一台，以先預約者優先；價格以預約時為準。</li>
    <li>本店保固 30 天，限非人為因素之功能故障；摔機、進水、螢幕破裂、自行或非本店拆修者不在保固範圍。</li>
    <li>本店為免用統一發票商家，交易以商品確認書及收據為憑。</li>
    <li>預約資料只用於本次看機、交易與保固服務。</li></ol></div>`;
}
function flowCard(holdDays, hasBundle) {
  return `<div class="card"><h2>購買流程</h2><ol>
    <li><b>填訂單</b>：確認商品資訊、檢測報告、注意事項${hasBundle ? '，選禮包' : ''}和付款方式，勾選同意後送出。</li>
    <li><b>付訂金</b>：售價 $5,000 以下訂金 $1,000，每多 $5,000 加 $1,000。LINE Pay 掃碼，或銀行匯款後回覆末五碼。</li>
    <li><b>對帳確認</b>：下一個營業日下午 3 點前確認入帳（星期日順延至星期一）。確認後保留 ${holdDays} 天，到期前一天提醒；查無款項自動取消。</li>
    <li><b>到店取機</b>：訂購人本人攜帶身分證件到門市核對身分；用「*#06#」核對 IMEI，親自檢查外觀與功能，滿意後簽署商品確認書、支付尾款，貼防拆標籤後交機。</li>
    <li><b>售後保固</b>：本店保固 30 天，可加購 Repair CARE+ 延長保固。</li></ol></div>`;
}
function noteCard(hasBundle) {
  return `<div class="card"><h2>注意事項</h2><ol>
    <li>中古商品：照片與檢測報告為驗機當時狀況，外觀以實機為準。</li>
    <li>只限門市取機，不提供寄送。</li>
    <li>訂金規則：<ul>
      <li>到店驗機，機況與說明不符或不滿意：訂金全額退還。</li>
      <li>付款後、店員確認入帳之前取消：訂金全額退還（尚未為您備貨）。</li>
      ${hasBundle ? '<li>店員確認入帳後（已開始為您備貨），因個人因素取消或超過保留期限未取機：扣除所選禮包原價後，退還其餘訂金。</li>' : '<li>店員確認入帳後，因個人因素取消或超過保留期限未取機：請與門市聯繫辦理退款。</li>'}</ul></li>
    <li>防範詐騙：匯款人須為訂購人本人。取機時核對訂購人身分證件，資料不符本店有權暫停交機並退回款項。</li>
    <li>每台僅一台，以完成對帳的先後為準；價格以訂單送出時為準。</li>
    <li>本店保固 30 天，限非人為因素之功能故障；摔機、進水、螢幕破裂、自行或非本店拆修者不在保固範圍。</li>
    <li>防拆標籤破損、撕除或經非本店人員拆修者，不適用本店保固。</li>
    <li>本店為免用統一發票商家，交易以商品確認書及收據為憑。</li>
    <li>訂單資料只用於本次交易、對帳與保固服務。</li></ol></div>`;
}
function bundleOpt(b, i) {
  const nine = Math.floor(b.value * 0.9 / 10) * 10;
  const calc = (b.items || []).length ? `${b.items.map(x => `${esc(x.name)} ${money(x.price)}`).join(' ＋ ')} ＝ 原價 <b>${money(b.value)}</b>` : (b.value ? `原價 <b>${money(b.value)}</b>` : '');
  const price = b.add === 0 ? '<b style="color:var(--green)">訂金禮包 免費</b>' : b.value && b.add === nine ? `加購 9 折優惠 ＝ <b style="color:var(--red)">${money(b.add)}</b>` : `加購價 <b style="color:var(--red)">${money(b.add)}</b>`;
  return `<label class="opt"><input type="radio" name="bundle" value="${i}"><div style="flex:1;min-width:0">
    ${b.img ? `<img src="${esc(b.img)}" alt="${esc(b.name)}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#f8fafc;margin-bottom:6px">` : ''}
    <b>${esc(b.name)}</b>${b.desc ? `<span class="mute" style="display:block">${esc(b.desc)}</span>` : ''}
    ${calc ? `<div style="font-size:13px;margin-top:4px">${calc}</div>` : ''}<div style="font-size:14px">${price}</div></div></label>`;
}
const PROMO = { min: 1000, off: 100 };
const accTot = items => { const sum = items.reduce((s, x) => s + Number(x.price || 0), 0), off = Math.floor(sum / PROMO.min) * PROMO.off; return { sum, off, pay: sum - off }; };
function accCard(acc) {
  if (!acc || !(acc.items || []).length) return '';
  return `<div class="card"><h2>🎧 加購配件（交機時確認）</h2>${acc.items.map((x, i) => `<label class="opt on"><input type="checkbox" name="acc" value="${i}" checked><div style="flex:1"><b>${esc(x.name)}</b><span class="mute">${money(x.price)}</span></div></label>`).join('')}
    <div id="accSum" style="margin-top:10px;text-align:right"></div><p class="mute" style="margin-top:4px">配件每滿 ${money(PROMO.min)} 折 ${money(PROMO.off)}。不要的可以取消勾選。<br>配件在<b>交機時跟您確認</b>：門市有現貨當場給您；需要調貨的，到貨後可<b>郵寄</b>或<b>到店取件</b>，郵寄地址交機後再填寫就好。</p></div>`;
}
function visitProd(it, shop) {
  return `<div class="card"><div class="prod">${(it.photos || [])[0] ? `<img src="${photo(it.photos[0])}" alt="">` : ''}<div>
    <span class="nm">${esc(it.model)}</span><span class="mute">${esc(it.color || '')}</span><div class="price">${money(it.price)}</div>
    <div>看機門市：<b>${esc(it.branch)}</b>・<b style="color:var(--green)">免訂金</b></div>
    <div class="mute">${esc(shop.addr || '')}　${esc(shop.tel || '')}</div></div></div></div>`;
}
function prodCard(it, dep, shop) {
  return `<div class="card"><div class="prod">${(it.photos || [])[0] ? `<img src="${photo(it.photos[0])}" alt="">` : ''}<div>
    <span class="nm">${esc(it.model)}</span><span class="mute">${esc(it.color || '')}</span><div class="price">${money(it.price)}</div>
    <div>訂金 <b style="color:var(--red)">${money(dep)}</b></div><div>取機門市：<b>${esc(it.branch)}</b></div>
    <div class="mute">${esc(shop.addr || '')}　${esc(shop.tel || '')}</div></div></div></div>`;
}

async function fill() {
  let d;
  try { d = await fetch(GAS + '?action=orderGet&t=' + T).then(r => r.json()); } catch { d = { ok: false, error: '網路不穩，請重新整理' }; }
  if (!d.ok) { m.innerHTML = `<div class="card big"><p style="font-weight:700">${esc(d.error)}</p></div>`; return; }
  const it = d.item, slots = d.slots || [];
  $('title').textContent = '預約看機';
  m.innerHTML = visitProd(it, d.shop) + accCard(d.acc) + checkCard(d.check, d.imei) + visitFlowCard() + visitNoteCard() +
    `<div class="card"><h2>📅 到店日期</h2>${slots.length ? slots.map((x, i) => `<button type="button" class="slot" data-d="${i}">${esc(x.label)}</button>`).join('') : '<p class="mute">這幾天沒有可預約的時段，請直接回覆 LINE 跟我們約時間</p>'}
      <h2 style="margin-top:14px">🕐 大約幾點到</h2><div id="hours"><p class="mute">先選日期</p></div>
      <p class="mute" style="margin-top:8px">營業時間 週一～週六 11:00–21:00（週日公休）</p></div>
    <div class="card"><h2>聯絡資料</h2>
      <label class="f">姓名</label><input class="t" id="name" autocomplete="name" placeholder="例：王小明">
      <label class="f">手機號碼</label><input class="t" id="phone" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxx"></div>
    <div class="card"><label class="agree"><input type="checkbox" id="agree"><span>我已閱讀以上檢測報告、看機流程與注意事項</span></label><div class="err" id="err"></div></div>`;
  let pickD = null, pickH = null;
  const drawHours = () => {
    const x = slots[pickD];
    $('hours').innerHTML = x ? x.hours.map(h => `<button type="button" class="slot${pickH === h ? ' on' : ''}" data-h="${h}">${h}:00</button>`).join('') : '<p class="mute">先選日期</p>';
    $('hours').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { pickH = Number(b.dataset.h); drawHours(); });
  };
  m.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    pickD = Number(b.dataset.d); pickH = null;
    m.querySelectorAll('[data-d]').forEach(y => y.classList.toggle('on', y === b)); drawHours();
  });
  const accItems = (d.acc && d.acc.items) || [];
  const keptAcc = () => [...m.querySelectorAll('input[name="acc"]:checked')].map(x => Number(x.value));
  const drawAcc = () => { const el = $('accSum'); if (!el) return; const t = accTot(keptAcc().map(i => accItems[i]));
    el.innerHTML = t.sum ? `配件 ${money(t.sum)}${t.off ? ` − 滿額折 ${money(t.off)}` : ''} ＝ <b style="color:var(--red);font-size:18px">${money(t.pay)}</b>` : '<span class="mute">沒有加購配件</span>'; };
  m.querySelectorAll('input[name="acc"]').forEach(x => x.addEventListener('change', () => { x.closest('.opt').classList.toggle('on', x.checked); drawAcc(); }));
  drawAcc();
  $('bar').style.display = 'block'; $('go').disabled = false; $('go').textContent = '確認預約';
  $('go').onclick = async () => {
    const err = $('err'); err.textContent = '';
    const body = { t: T, name: $('name').value.trim(), phone: $('phone').value.trim(), agree: $('agree').checked, acc: keptAcc(),
      visitDate: pickD != null ? slots[pickD].date : '', visitTime: pickH != null ? pickH + ':00' : '' };
    if (!body.visitDate) return err.textContent = '請選擇到店日期';
    if (!body.visitTime) return err.textContent = '請選擇大約幾點到';
    if (!body.name) return err.textContent = '請填寫姓名';
    if (!/^09\d{8}$/.test(body.phone.replace(/\D/g, ''))) return err.textContent = '請填寫正確的手機號碼';
    if (!body.agree) return err.textContent = '請勾選「我已閱讀」';
    $('go').disabled = true; $('go').textContent = '送出中…';
    let r;
    try { r = await fetch(GAS + '?action=orderSubmit', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(x => x.json()); }
    catch { r = { ok: false, error: '網路不穩，請再按一次' }; }
    if (!r.ok) { err.textContent = r.error; $('go').disabled = false; $('go').textContent = '確認預約'; return; }
    done(r, it);
  };
}
function done(r, it) {
  $('bar').style.display = 'none'; scrollTo(0, 0);
  $('title').textContent = '預約完成';
  const lineUrl = r.basicId ? `https://line.me/R/ti/p/${encodeURIComponent(r.basicId)}` : '';
  const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('復原者手機維修 ' + (r.shop.addr || ''));
  m.innerHTML = `<div class="card big"><div class="ok">✓</div><h2 style="font-size:20px">預約 ${esc(r.orderNo)}</h2><p><b>${esc(it.model)}</b></p>
    <div class="pay"><b>📅 ${esc(r.visit)}</b><br>📍 ${esc(r.branch)}：${esc(r.shop.addr || '')}<br>📞 ${esc(r.shop.tel || '')}
      <p class="mute" style="margin-top:6px">機子會保留到預約當天營業結束。到店跟店員說預約編號或姓名就可以 😊<br>前一天會用 LINE 提醒您；要改時間直接回覆 LINE。</p></div>
    <a class="btn" style="margin-top:14px" href="${map}" target="_blank">🗺️ 開啟地圖導航</a>
    ${lineUrl ? `<a class="btn dark" style="margin-top:10px" href="${lineUrl}">💬 回到 LINE</a>` : ''}
    <a class="btn ghost" style="margin-top:10px" href="?k=${esc(r.viewKey)}">📄 查看預約內容</a></div>`;
}
async function view() {
  let d;
  try { d = await fetch(GAS + '?action=orderView&k=' + K).then(r => r.json()); } catch { d = { ok: false, error: '網路不穩，請重新整理' }; }
  if (!d.ok) { m.innerHTML = `<div class="card big"><p style="font-weight:700">${esc(d.error)}</p></div>`; return; }
  const o = d.order;
  $('title').textContent = (o.method === 'visit' ? '預約 ' : '訂單 ') + o.orderNo;
  m.innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:17px">訂單 ${esc(o.orderNo)}</b><span class="status">${esc(o.status)}</span></div>
      <table style="margin-top:8px">
      <tr><td>商品</td><td><b>${esc(o.model)}</b></td></tr><tr><td>售價</td><td>${money(o.price)}</td></tr>${o.method === 'visit' ? `<tr><td>預約到店</td><td><b>${esc(o.visit)}</b>（免訂金）</td></tr>` : `<tr><td>訂金</td><td>${money(o.deposit)}（${o.method === 'bank' ? '匯款' + (o.last5 ? ' 末碼 ' + esc(o.last5) : '') : 'LINE Pay'}）</td></tr>`}
      ${o.bundle ? `<tr><td>禮包</td><td>${esc(o.bundle)}${o.bundleAdd ? '（加購 ' + money(o.bundleAdd) + '）' : '（免費）'}<div class="mute">${esc(o.bundleDesc || '')}${o.bundleValue ? '・原價 ' + money(o.bundleValue) : ''}</div></td></tr>` : ''}
      ${o.accItems ? `<tr><td>加購配件</td><td>${o.accItems.split('\n').map(esc).join('<br>')}<div class="mute">配件 ${money(o.accSum)}${Number(o.accOff) ? ' − 滿額折 ' + money(o.accOff) : ''} ＝ ${money(o.accPay)}</div></td></tr>` : ''}
      ${o.method === 'visit' ? `<tr><td>合計（到店驗機滿意再付）</td><td><b>${money(Number(o.price) + Number(o.accPay || 0))}</b></td></tr>` : `<tr><td>尾款（取機時付）</td><td><b>${money(Number(o.price) - Number(o.deposit) + Number(o.bundleAdd || 0) + Number(o.accPay || 0))}</b></td></tr>`}
      <tr><td>取機門市</td><td>${esc(o.branch)}<div class="mute">${esc(d.shop.addr || '')} ${esc(d.shop.tel || '')}</div></td></tr>
      <tr><td>訂購人</td><td>${esc(o.name)} ${esc(o.phone)}</td></tr>
      ${o.holdUntil ? `<tr><td>保留到</td><td><b>${esc(o.holdUntil)}</b> 營業結束</td></tr>` : o.confirmBy ? `<tr><td>對帳期限</td><td>${esc(o.confirmBy)}</td></tr>` : ''}
      <tr><td>同意條款時間</td><td>${esc(new Date(o.agreedAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false }))}</td></tr></table></div>` +
    checkCard(d.check, o.imei) + (o.method === 'visit' ? visitFlowCard() + visitNoteCard() : flowCard(d.holdDays, !!o.bundle) + noteCard(!!o.bundle)) +
    `<div class="card sig"><div>客人簽名：</div><div>經手人員：</div></div>
     <div class="np"><button class="btn dark" onclick="print()">📄 下載 PDF／列印</button><p class="mute" style="text-align:center;margin-top:6px">iPhone：按下後選「分享」→「儲存到檔案」；Android：選「另存為 PDF」</p></div>`;
}
if (K) view(); else if (T) fill(); else m.innerHTML = '<div class="card big"><p>請從 LINE 的「📅 預約看機」打開這個頁面</p></div>';
</script>
