<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>復原者 每日登打｜銷售報表</title>
<style>
:root{--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--card:#fff;--red:#d71920;--green:#15803d;--blue:#1d4ed8;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-box h1{font-size:20px;margin-bottom:14px}
.login-box input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 10px;margin-bottom:10px}
header{background:var(--ink);color:#fff;padding:10px 16px;border-bottom:4px solid var(--red);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
.logo{font-weight:900;font-size:16px;letter-spacing:1px;margin-right:auto}
.logo small{display:block;font-weight:400;font-size:11px;color:#a1a6b0;letter-spacing:2px}
.hd select,.hd input[type=month]{background:#2a2d35;color:#fff;border:1px solid #444;border-radius:8px;padding:5px 8px}
.hbtn{background:none;border:1px solid #555;color:#ddd;border-radius:8px;padding:5px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13px}
.hbtn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
main{max-width:1280px;margin:0 auto;padding:12px 12px 80px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:150px}
.sum b{display:block;font-size:20px}
.sum small{color:var(--mute);font-size:12px}
.sum input{width:120px;border:1px solid #d1d5db;border-radius:6px;padding:3px 6px;font-size:18px;font-weight:700}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fafafa;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-h .d{font-weight:900;font-size:16px}
.day-h .t{margin-left:auto;font-size:13px;color:var(--mute)}
.day-h .t b{color:var(--ink);font-size:15px;margin:0 10px 0 4px}
.wrap{overflow-x:auto}
table.g{border-collapse:collapse;width:100%;min-width:1100px;table-layout:fixed}
table.g th{font-size:12px;color:var(--mute);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);background:#fff}
table.g td{border-bottom:1px solid #f0f0f0;padding:0;vertical-align:middle}
table.g td input{width:100%;border:0;background:transparent;padding:7px 6px;outline:none}
table.g td input:focus{background:#fff8e1;box-shadow:inset 0 0 0 2px #f59e0b}
table.g td.num input{text-align:right}
table.g td.ro{padding:7px 6px;text-align:right;color:var(--green);font-weight:600}
tr.exp td input{color:#b91c1c}
tr.ghost td input::placeholder{color:#c4c7cc}
tr.saving td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
tr.err td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.wty{font-size:11px;padding:2px 6px;border-radius:99px;white-space:nowrap;display:inline-block;margin:0 4px}
.wty.ok{background:#dcfce7;color:var(--green)}
.wty.none{background:#f3f4f6;color:#9ca3af}
.wty.warn{background:#fef3c7;color:var(--amber)}
.del{border:0;background:none;color:#c4c7cc;cursor:pointer;font-size:15px;padding:4px 8px}
.del:hover{color:var(--red)}
.cash{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:#fffdf5;border-top:1px dashed #e5d9a8;font-size:14px}
.cash b{font-size:16px}.cash input{width:110px;border:1px solid #d1d5db;border-radius:6px;padding:5px 7px;text-align:right;font-size:15px}
.cash input::placeholder{color:#b6b9bf}.cash .ok{color:var(--green);font-weight:800}.cash .over{color:var(--blue);font-weight:800}.cash .short{color:var(--red);font-weight:800}
.add-day{display:flex;gap:8px;align-items:center;background:#fff;border:1px dashed #c7cbd1;border-radius:12px;padding:12px;margin-bottom:12px;flex-wrap:wrap}
.add-day input{border:1px solid #d1d5db;border-radius:8px;padding:6px 8px}
.btn{border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #d1d5db}
.hint{font-size:12px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:99;font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}
.status{font-size:12px;color:#a1a6b0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%}
.modal .box h3{margin-bottom:10px}
.modal label{display:flex;gap:8px;align-items:center;margin:6px 0}

/* ═══ 月統計 ═══ */
#stats{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;--s1:#2a78d6;--neg:#eb6834}
#stats h3{font-size:15px;margin-bottom:8px}
.st-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.tiles b{display:block;font-size:22px}
.tiles small{color:var(--mute);font-size:12px}
.cat{display:grid;grid-template-columns:110px 1fr 230px;gap:10px;align-items:center;padding:3px 0;font-size:13px;cursor:default}
.cat:hover{background:#f7f8fa}
.cat .lab{font-weight:600;text-align:right}
.cat .trk{height:16px;position:relative}
.cat .bar{height:16px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.cat .bar.neg{background:var(--neg)}
.cat .val{color:#374151;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .val small{color:var(--mute)}
.daily{margin-top:16px}
.daily svg{width:100%;height:170px;display:block}
.daily .axis{font-size:10px;fill:#6b7280}
.daily rect.c{fill:var(--s1)}
.daily rect.hit{fill:transparent;cursor:default}
.daily rect.hit:hover + rect.c,.daily g:hover rect.c{opacity:.75}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;z-index:80;display:none;white-space:nowrap}
/* ═══ 列印：照 Excel「銷售報表」格式，A4 直式，每頁 63 格 ═══ */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:7mm 6mm}
  body{background:#fff}
  #login,#app,#toast,.modal{display:none!important}
  #print{display:block}
  .pg{page-break-after:always;font-size:8.2pt;color:#000}
  .pg:last-child{page-break-after:auto}
  .pg h1{text-align:center;font-size:15pt;letter-spacing:10px;margin:0 0 1mm}
  .pg .unit{display:flex;justify-content:space-between;font-size:9pt;margin-bottom:1mm;padding:0 2mm}
  .pg table{border-collapse:collapse;width:100%;table-layout:fixed}
  .pg td{border:.4pt solid #000;height:4.05mm;padding:0 1mm;overflow:hidden;white-space:nowrap;text-overflow:clip;line-height:4mm}
  .pg td.r{text-align:right}
  .pg td.c{text-align:center}
  .pg tr.th td{font-weight:700;text-align:center}
  .pg tr.tot td{font-weight:700}
  .pg .neg{color:#c00}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <h1>復原者 每日登打</h1>
    <input name="email" type="email" placeholder="帳號（Email）" required autocomplete="username">
    <input name="pw" type="password" placeholder="密碼" required autocomplete="current-password">
    <button class="btn" style="width:100%">登入</button>
    <p class="hint" style="margin-top:10px">與保固系統同一組帳號</p>
  </form>
</section>

<section id="app" class="hidden">
  <header><div class="hd">
    <div class="logo">每日登打 · 銷售報表<small>GRANDMASTER FIX LEDGER</small></div>
    <select id="branch"><option>楠梓店</option><option>德賢店</option></select>
    <input type="month" id="month">
    <span class="status" id="sync">已同步</span>
    <button class="hbtn" id="statBtn">📊 月統計</button>
    <button class="hbtn pri" id="snapBtn">📷 報表下載</button>
    <button class="hbtn" id="printBtn">🖨 列印</button>
    <button class="hbtn" id="xlsxBtn">⬇ 匯出 Excel</button>
    <button class="hbtn" id="impBtn">📥 匯入舊報表</button><button class="hbtn hidden" id="undoImp" title="把這個月恢復成匯入前的樣子">↩️ 還原上次匯入</button><input type="file" id="impFile" accept=".xlsx,.xls" class="hidden">
    <a class="hbtn" href="quotes.html">💰 報價</a><a class="hbtn" href="stock.html">📱 中古機庫存</a>
    <a class="hbtn" href="./">← 保固系統</a>
  </div></header>
  <main>
    <div class="sum">
      <div><small>承上月金額</small><input id="carry" type="number" step="1"></div>
      <div><small>本月收支</small><b id="sMonth">0</b></div>
      <div><small>目前結餘</small><b id="sBal">0</b></div>
      <div><small>本月毛利</small><b id="sProfit" style="color:var(--green)">0</b></div>
      <div><small>今天筆數</small><b id="sToday">0</b></div>
      <div style="flex:1;min-width:260px" title="接待人分毛利 30%、經手人分 70%（同一人＝100%）。人員名單在「📊 月統計 → ⚙️ 人員設定」"><small>本月人員毛利（接待 30%・經手 70%）</small><div id="sStaff" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:3px"></div></div>
    </div>
    <div id="stats" class="hidden"></div>
    <div id="days"></div>
    <div class="add-day">
      <b>新增日期</b><input type="date" id="newDate"><button class="btn ghost" id="addDayBtn">＋ 加入</button>
      <span class="hint">打字就會自動儲存；品項有電話的會自動建立保固紀錄。按 Enter 跳到下一列。支出請寫「支出:廠商」，付錢打負數、廠商退貨退錢打正數。每天下方「點錢」填保險櫃與抽屜現金，會自動比對帳上結餘。退修請寫「退修 10/27 13電池/雄0908」＋電話，原因寫在備註，保固系統會多一筆退修紀錄。</span>
    </div>
  </main>
</section>

<div id="print"></div>
<div id="tip"></div>
<div id="snap" style="position:fixed;left:-9999px;top:0"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { ask } from './ask.js?v=20261116';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot, query, where, getDocs, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { CATS, parseItems, warrantyFields, dateFromType, ymd, normPhone, refundInfo, refundRecord } from './rules.js?v=20261115b';

const app = initializeApp({
  apiKey: "AIzaSyD04ZMXIt8Oo3hjm5qsMaKiLXYzp_9YKwA", authDomain: "care-warranty.firebaseapp.com",
  projectId: "care-warranty", storageBucket: "care-warranty.firebasestorage.app",
  messagingSenderId: "29512690431", appId: "1:29512690431:web:f0c2dd1cd6acb03d197aca"
});
const auth = getAuth(app), db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const $ = id => document.getElementById(id);
const WD = '日一二三四五六';
const FIELDS = ['item', 'amount', 'recv', 'handler', 'note', 'cost', 'phone', 'ticket'];

let rows = {};            // id → row（目前分店＋月份）
let extraDays = new Set(); // 新增但還沒有資料的日期
let meta = null, unsub = null, unsubMeta = null, unsubCash = null, cash = {};
const timers = {}, dirty = new Set();

/* ─── 小工具 ─── */
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(String(v ?? '').replace(/[,\s]/g, '')); return String(v ?? '').trim() === '' || isNaN(n) ? null : n; };
const fmt = n => n == null ? '' : Number(n).toLocaleString('en-US');
const isRefund = r => !!refundInfo(r.item, r.date);
const isExpense = r => /^支出/.test(String(r.item || '').trim()) || (num(r.amount) ?? 0) < 0;
// 毛利：一般銷售 = 金額 − 成本（成本打正負數都可以）；退修 = 金額 ＋ 成本（照 Excel，金額負數、成本正數 → 毛利負數）；支出不算
const profit = r => {
  const a = num(r.amount), c = num(r.cost);
  if (isRefund(r)) return a == null && c == null ? null : (a ?? 0) + (c ?? 0);
  if (a == null || isExpense(r)) return null;
  return a - Math.abs(c ?? 0);
};
const bm = () => `${$('branch').value}_${$('month').value}`;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function setSync(s) { $('sync').textContent = s; }
const newId = () => doc(collection(db, 'ledger')).id;

/* ─── 登入 ─── */
onAuthStateChanged(auth, u => {
  $('login').classList.toggle('hidden', !!u); $('app').classList.toggle('hidden', !u);
  if (u) { start(); listenStaff(); }
});
$('loginForm').onsubmit = async e => {
  e.preventDefault(); const f = e.target;
  try { await signInWithEmailAndPassword(auth, f.email.value.trim(), f.pw.value); } catch (er) { toast('⚠️ 登入失敗'); }
};

function start() {
  $('branch').value = lsGet('ledgerBranch') || '楠梓店';
  const t = new Date(); $('month').value = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`;
  $('newDate').value = ymd(t);
  $('branch').onchange = () => { lsSet('ledgerBranch', $('branch').value); load(); };
  $('month').onchange = load;
  load();
}

/* ─── 讀取（即時同步，兩人同時打也會互相看到）─── */
function load() {
  if (unsub) unsub(); if (unsubMeta) unsubMeta(); if (unsubCash) unsubCash(); cash = {};
  rows = {}; extraDays = new Set(); meta = null;
  const t = new Date(), cur = ymd(t);
  if (cur.slice(0, 7) === $('month').value && t.getDay() !== 0) extraDays.add(cur);
  render();
  checkUndo();
  unsub = onSnapshot(query(collection(db, 'ledger'), where('bm', '==', bm())), snap => {
    let structural = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, d = ch.doc.data();
      if (ch.type === 'removed') { delete rows[id]; structural = true; return; }
      if (dirty.has(id)) return;                     // 自己正在打的那列不要被蓋掉
      if (!rows[id] || rows[id].date !== d.date) structural = true;
      rows[id] = { id, ...d };
      if (!structural) patchRow(rows[id]);
    });
    if (structural) render(); else totals();
    setSync(snap.metadata.hasPendingWrites ? '儲存中…' : '已同步');
  }, er => toast('⚠️ 讀取失敗：' + er.message));
  unsubCash = onSnapshot(query(collection(db, 'ledger_cash'), where('bm', '==', bm())), s => {
    s.docs.forEach(d => { const x = d.data(); cash[x.date] = { safe: x.safe ?? '', drawer: x.drawer ?? '', extra: x.extra ?? '' }; });
    totals();
  }, () => {});
  unsubMeta = onSnapshot(doc(db, 'ledger_meta', bm()), async s => {
    meta = s.exists() ? s.data() : null;
    if (document.activeElement !== $('carry')) $('carry').value = meta?.carry ?? '';
    if (!s.exists()) suggestCarry();
    totals();
  });
}

// 沒填承上月金額時，自動用上個月的結餘帶入（仍可手動修改）
async function suggestCarry() {
  const [y, m] = $('month').value.split('-').map(Number);
  const pm = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
  const key = `${$('branch').value}_${pm}`;
  try {
    const pmeta = await getDoc(doc(db, 'ledger_meta', key));
    const prs = await getDocs(query(collection(db, 'ledger'), where('bm', '==', key)));
    if (!pmeta.exists() && prs.empty) return;
    let bal = Number(pmeta.data()?.carry || 0); prs.forEach(d => bal += num(d.data().amount) ?? 0);
    (await getDocs(query(collection(db, 'ledger_cash'), where('bm', '==', key)))).forEach(d => bal += num(d.data().extra) ?? 0);
    if (!meta && $('carry').value === '') { $('carry').value = bal; $('carry').placeholder = '上月結餘'; totals(); }
  } catch {}
}
$('carry').onchange = async () => {
  try { await setDoc(doc(db, 'ledger_meta', bm()), { carry: num($('carry').value) ?? 0, updatedAt: new Date().toISOString(), updatedBy: auth.currentUser.email }, { merge: true }); toast('已儲存承上月金額'); }
  catch (er) { toast('⚠️ ' + er.message); }
};

/* ─── 畫面 ─── */
function daysList() {
  const s = new Set(extraDays); Object.values(rows).forEach(r => s.add(r.date));
  return [...s].filter(d => d.slice(0, 7) === $('month').value).sort();
}
const dayRows = d => Object.values(rows).filter(r => r.date === d).sort((a, b) => (a.order || 0) - (b.order || 0));

function rowHTML(r, ghost) {
  const v = f => esc(r[f] ?? '');
  return `<tr data-id="${r.id}" data-date="${r.date}" class="${ghost ? 'ghost' : ''}${!ghost && isExpense(r) ? ' exp' : ''}">
    <td><input data-f="item" value="${v('item')}" placeholder="${ghost ? '輸入品項…（例：13 電池/雄0915、支出:鴻勝）' : ''}"></td>
    <td class="num"><input data-f="amount" value="${v('amount')}" inputmode="text" enterkeyhint="next"></td>
    <td><input data-f="recv" value="${v('recv')}"></td>
    <td><input data-f="handler" value="${v('handler')}"></td>
    <td><input data-f="note" value="${v('note')}"></td>
    <td class="num"><input data-f="cost" value="${v('cost')}" inputmode="text" enterkeyhint="next"></td>
    <td class="ro" data-p>${ghost ? '' : fmt(profit(r))}</td>
    <td><input data-f="phone" value="${v('phone')}" inputmode="tel"></td>
    <td><input data-f="ticket" value="${v('ticket')}"></td>
    <td data-w>${ghost ? '' : wtyChip(r)}</td>
    <td>${ghost ? '' : `<button class="del" title="刪除這列" data-del="${r.id}">✕</button>`}</td>
  </tr>`;
}
function wtyChip(r) {
  if (isRefund(r)) {
    const ph = normPhone(r.phone);
    if (!/^09\d{8}$/.test(ph)) return '<span class="wty warn">退修：請填電話</span>';
    const info = refundInfo(r.item, r.date);
    return `<span class="wty warn">🔁 退修紀錄${info.origDate ? '（原 ' + info.origDate.slice(5).replace('-', '/') + '）' : ''}</span>`;
  }
  if (isExpense(r) || !String(r.item || '').trim()) return '';
  const ph = normPhone(r.phone);
  if (!ph) return '<span class="wty none">無電話</span>';
  if (!/^09\d{8}$/.test(ph)) return '<span class="wty warn">電話格式?</span>';
  const its = parseItems(r.item).filter(k => k !== 'none' && k !== 'other');
  if (!its.length) return '<span class="wty none">✓ 已建檔</span>';
  // 只顯示一般保固天數；CARE+ 要客人用 LINE 登錄才會加上，放在滑過提示
  const tip = its.filter(k => CATS[k].care).map(k => `${CATS[k].label}：客人用 LINE 登錄 CARE+ 後再 +${CATS[k].care} 天`).join('\n');

}

function totals() {
  let monthSum = 0, prof = 0;
  daysList().forEach(d => {
    const rs = dayRows(d);
    const s = rs.reduce((a, r) => a + (num(r.amount) ?? 0), 0);
    const p = rs.reduce((a, r) => a + (profit(r) ?? 0), 0);
    monthSum += s; prof += p;
    const el = document.querySelector(`section[data-day="${d}"] [data-t]`);
    if (el) el.innerHTML = `${rs.length} 筆　合計<b>${fmt(s)}</b>毛利<b style="color:var(--green)">${fmt(p)}</b>`;
  });
  const carry = num($('carry').value) ?? 0;
  let run = carry, lastSafe = '';
  daysList().forEach(d => {
    run += dayRows(d).reduce((a, r) => a + (num(r.amount) ?? 0), 0) + extraOf(d);
    const box = document.querySelector(`[data-cash="${d}"]`); if (!box) return;
    const c = cash[d] || {}, si = box.querySelector('[data-c=safe]'), di = box.querySelector('[data-c=drawer]'), xi = box.querySelector('[data-c=extra]');
    if (document.activeElement !== si) si.value = c.safe ?? '';
    if (document.activeElement !== di) di.value = c.drawer ?? '';
    if (document.activeElement !== xi) xi.value = c.extra ?? '';
    si.placeholder = lastSafe !== '' ? fmt(lastSafe) + '（沿用）' : '金額';
    di.placeholder = '點完填';
    box.querySelector('[data-bal]').textContent = fmt(run);
    const safe = num(si.value) ?? (lastSafe === '' ? null : lastSafe), drawer = num(di.value);
    if (num(si.value) != null) lastSafe = num(si.value);
    const df = box.querySelector('[data-diff]');
    if (drawer == null) { df.innerHTML = ''; return; }
    const diff = (safe ?? 0) + drawer - run;
    df.innerHTML = diff === 0 ? '<span class="ok">✓ 正確</span>' : diff > 0 ? `<span class="over">多 ${fmt(diff)} 元</span>` : `<span class="short">少 ${fmt(-diff)} 元</span>`;
  });
  $('sMonth').textContent = fmt(monthSum);
  const extras = Object.keys(cash).filter(x => x.slice(0, 7) === $('month').value).reduce((a, x) => a + extraOf(x), 0);
  $('sBal').textContent = fmt(carry + monthSum + extras);
  $('sProfit').textContent = fmt(prof);
  $('sToday').textContent = dayRows(ymd(new Date())).length;
  renderStaffTop();
  clearTimeout(totals._st); totals._st = setTimeout(renderStats, 400);
}

async function save(id) {
  const r = rows[id]; if (!r) return;

    setSync('已同步');

    tr()?.classList.add('err'); setSync('⚠️ 儲存失敗');

// 有電話的維修品項 → 自動建立／更新保固紀錄（與 Excel 匯入同規則；月初再匯入會自動略過重複）
async function syncWarranty(id, r) {
  if (rows[id]?.imported) return;   // 從舊 Excel 匯入的列：保固紀錄在匯入時已處理，避免重複
  const ref = doc(db, 'records', 'L' + id);
  const phone = normPhone(r.phone);
  const refund = isRefund(r);
  if ((!refund && isExpense(r)) || !r.item || !/^09\d{8}$/.test(phone)) {
    if (rows[id]?._hadRec !== false) { await deleteDoc(ref); if (rows[id]) rows[id]._hadRec = false; }   // 不存在也不會出錯
    return;
  }
  const repairDate = dateFromType(r.item, r.date) || r.date;
  let rec = {
    branch: r.branch, repairDate, bookedDate: r.date, name: (r.ticket || '').replace(/[RS]$/, '') || '（未填）',
    phone, type: r.item, ...warrantyFields(parseItems(r.item), 0), price: r.amount, note: r.note,
    source: 'ledger', ledgerId: id, createdAt: r.createdAt, createdBy: r.createdBy,
    updatedAt: r.updatedAt, updatedBy: r.updatedBy, kind: 'repair'
  };
  if (refund) rec = refundRecord(rec, r.date);
  await setDoc(ref, rec, { merge: true });
  if (rows[id]) rows[id]._hadRec = true;
}

// 鍵盤移動（像 Excel）：Enter／↓ 下一列、Shift+Enter／↑ 上一列（跨天也可以）；
// ← → 在游標已經在文字最前／最後時，跳到左／右一欄（否則照常移動游標，方便改字）
$('days').addEventListener('keydown', e => {
  if (e.isComposing || e.altKey || e.ctrlKey || e.metaKey) return;
  const i = e.target.closest('input[data-f]'); if (!i) return;
  const k = e.key, tr = i.closest('tr');
  const go = el => { if (!el) return; e.preventDefault(); el.focus(); try { el.select(); } catch {} };
  if (k === 'Enter' || k === 'ArrowDown' || k === 'ArrowUp') {
    const up = k === 'ArrowUp' || (k === 'Enter' && e.shiftKey);
    const trs = [...document.querySelectorAll('#days tr')].filter(t => t.querySelector('input[data-f]'));
    const n = trs[trs.indexOf(tr) + (up ? -1 : 1)];
    if (!n) { if (k === 'Enter') e.preventDefault(); return; }
    go(n.querySelector(`input[data-f="${i.dataset.f}"]`) || n.querySelector('input[data-f="item"]'));
    return;
  }
  if (k === 'ArrowLeft' || k === 'ArrowRight') {
    const s0 = i.selectionStart, s1 = i.selectionEnd, len = i.value.length;
    const all = s0 === 0 && s1 === len;                     // 整格反白時也直接跳欄
    if (k === 'ArrowLeft' && !(s0 === 0 && s1 === 0) && !all) return;
    if (k === 'ArrowRight' && !(s0 === len && s1 === len) && !all) return;
    const ins = [...tr.querySelectorAll('input[data-f]')];
    go(ins[ins.indexOf(i) + (k === 'ArrowLeft' ? -1 : 1)]);
  }
});

/* ─── 月統計：依品項分類（維修零件、手機、配件、服務）─── */
const REPAIR_LABEL = { used: '中古機', newphone: '新機', screen: '螢幕／液晶', battery: '電池', port: '尾插', board: '主機板', flex: '排線／聽筒／喇叭', camera: '鏡頭維修' };
const ORDER = ['中古機', '新機', '螢幕／液晶', '電池', '尾插', '主機板', '排線／聽筒／喇叭', '鏡頭維修', '外觀零件', '保護貼', '保護殼', '線材／充電', '服務', '其他'];
function statCat(item) {
  let t = String(item || '').replace(/\s+/g, '');
  if (/回收|進貨退出|退貨給|房租|收入|出貨|借支|還款|零用金/.test(t)) return '其他收入';   // 不算銷售
  if (/寄賣|收購/.test(t)) return '中古機';
  t = t.replace(/充電孔清潔|孔清潔/g, '清潔');
  const rep = parseItems(t).find(k => REPAIR_LABEL[k]);
  if (rep) return REPAIR_LABEL[rep];
  if (/背蓋|後蓋|中框|外殼|按鍵|開機鍵|音量鍵/.test(t)) return '外觀零件';
  if (/滿玻|玻保|保護貼|玻璃貼|鏡頭貼|霧面|抗藍光|藍寶石/.test(t)) return '保護貼';
  if (/殼|犀牛盾|惡魔盾|皮套/.test(t)) return '保護殼';
  if (/線|充電頭|旅充|行動電源|掛繩|耳機|充電器|快充/.test(t)) return '線材／充電';
  if (/資料轉移|轉移|掃毒|清潔|代工|調整|刷機|軟體|升級|檢測|貼膜|移電|備份/.test(t)) return '服務';
  return '其他';
}
let statMetric = 'rev', statScope = 'one', otherRows = [];

// 毛利分配：接待人 30%、經手人 70%（同一人＝100%；只填一邊＝那個人 100%；退修的負毛利也照比例扣）
const SPLIT = { recv: 0.3, handler: 0.7 };
// 員工編號（接待人／經手人欄位填編號；填名字也會對到同一人）。名單存在資料庫，可在月統計的「⚙️ 人員設定」新增／修改
let STAFF = { '1': '王又祥', '2': '阿賢', '4': 'APPLE' }, staffEdit = false;
let staffSub = null;
function listenStaff() { if (staffSub) return; staffSub = onSnapshot(doc(db, 'settings', 'staff'), s => { if (s.exists() && s.data().list) STAFF = s.data().list; renderStats(); renderStaffTop(); }, () => { staffSub = null; }); }
async function saveStaff(list) {
  try { await setDoc(doc(db, 'settings', 'staff'), { list, updatedAt: new Date().toISOString(), updatedBy: auth.currentUser.email }); }
  catch (e) { toast('⚠️ 人員名單儲存失敗：' + e.message); }
}
const staffKey = v => { const t = String(v || '').trim(); if (!t) return ''; const hit = Object.entries(STAFF).find(([, n]) => n.toLowerCase() === t.toLowerCase()); return hit ? hit[0] : t; };
const staffLabel = k => STAFF[k] ? `${k} ${STAFF[k]}` : (/^\d+$/.test(k) ? `${k}（未設定）` : k);
function staffSplit(list) {
  const p = {};
  const add = (name, k, amt) => { const o = (p[name] ||= { name, rn: 0, hn: 0, r: 0, h: 0 }); o[k === 'recv' ? 'rn' : 'hn']++; o[k === 'recv' ? 'r' : 'h'] += amt; };
  list.forEach(row => {
    const pf = profit(row); if (pf == null || pf === 0) return;
    const r = staffKey(row.recv), h = staffKey(row.handler);
    if (r && h && r !== h) { add(r, 'recv', pf * SPLIT.recv); add(h, 'handler', pf * SPLIT.handler); }
    else if (r && h) { add(r, 'recv', pf * SPLIT.recv); add(h, 'handler', pf * SPLIT.handler); }   // 同一人：兩份都算給他＝100%
    else if (r) add(r, 'recv', pf);
    else if (h) add(h, 'handler', pf);
    else add('（未填）', 'handler', pf);
  });
  return Object.values(p).map(o => ({ ...o, t: o.r + o.h })).sort((a, b) => b.t - a.t);
}
// 上方即時顯示：這個月（目前分店）每個人分到的毛利
function renderStaffTop() {
  const el = $('sStaff'); if (!el) return;
  const st = staffSplit(Object.values(rows)), by = Object.fromEntries(st.map(o => [o.name, o.t]));
  const keys = [...new Set([...Object.keys(STAFF).filter(k => STAFF[k]), ...st.map(o => o.name)])]
    .sort((a, b) => (Number(a) || 999) - (Number(b) || 999) || a.localeCompare(b));
  el.innerHTML = keys.map(k => `<span style="background:#f3f4f6;border-radius:8px;padding:3px 10px;white-space:nowrap">
      <span style="color:var(--mute);font-size:12px">${esc(staffLabel(k))}</span>
      <b style="display:inline;font-size:17px;margin-left:4px;color:${(by[k] || 0) < 0 ? 'var(--red)' : 'var(--green)'}">${fmt(Math.round(by[k] || 0))}</b></span>`).join('')
    || '<span class="hint">還沒有毛利資料</span>';
}
function renderStats() {
  if ($('stats').classList.contains('hidden')) return;
  const all = statRows();
  const pos = all.filter(r => !isExpense(r) && !isRefund(r) && (num(r.amount) ?? 0) > 0);
  const sales = pos.filter(r => statCat(r.item) !== '其他收入');
  const otherInc = pos.filter(r => statCat(r.item) === '其他收入');
  const refunds = all.filter(r => isRefund(r));
  const sum = (a, f) => a.reduce((s, r) => s + (f(r) ?? 0), 0);
  const rev = sum(sales, r => num(r.amount)), prof = sum(sales, profit), refAmt = sum(refunds, r => num(r.amount)), refProf = sum(refunds, profit);
  // 分類
  const g = {};
  sales.forEach(r => { const c = statCat(r.item); (g[c] ||= { c, n: 0, rev: 0, prof: 0 }); g[c].n++; g[c].rev += num(r.amount) ?? 0; g[c].prof += profit(r) ?? 0; });
  const key = { rev: 'rev', prof: 'prof', n: 'n' }[statMetric];
  const cats = Object.values(g).sort((a, b) => b[key] - a[key] || ORDER.indexOf(a.c) - ORDER.indexOf(b.c));
  const max = Math.max(1, ...cats.map(c => Math.abs(c[key])));
  const unit = statMetric === 'n' ? ' 件' : '';
  const money = v => (statMetric === 'n' ? v : 'NT$ ' + fmt(v)) + unit;
  // 每日
  const days = {};

/* ─── 匯入舊的 Excel 銷售報表（匯整1、匯整2…）→ 登打頁；同時補上缺的保固紀錄（與保固系統匯入同規則、自動去重）─── */
$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importXlsx(f); };

function parseLedgerXlsx(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  let branch = '', ym = '', carry = null, out = [], seq = 0;
  wb.SheetNames.forEach(sn => {
    if (/交接|報價|退貨|廢/.test(sn)) return;
    const A = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: true, cellDates: true });
    const h = A.findIndex(r => r.some(c => /[連聯]絡電話/.test(String(c).replace(/\s/g, ''))));
    if (h < 0) return;
    const H = A[h].map(c => String(c).replace(/\s+/g, ''));
    const col = k => H.findIndex(x => x.includes(k));
    const C = { date: col('日期'), item: col('品項'), amt: col('金額'), recv: col('接待'), hand: col('經手'), note: H.findIndex(x => /備[註注]/.test(x)),
      cost: col('成本'), phone: H.findIndex(x => /[連聯]絡電話/.test(x)), ticket: col('單號') };
    A.slice(0, h).forEach(r => r.forEach(c => {
      const t = String(c);
      if (!branch && /楠梓店/.test(t)) branch = '楠梓店'; if (!branch && /德賢店/.test(t)) branch = '德賢店';
      const m = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/); if (m && !ym) ym = `${m[1]}-${m[2].padStart(2, '0')}`;
    }));
    let cur = '';
    for (const r of A.slice(h + 1)) {
      const c0 = String(r[C.date] ?? '').trim(), item = String(r[C.item] ?? '').trim();
      if (c0 === '零用金' || /^(保險櫃|現金|多錢|大吉大利)/.test(item)) break;     // 頁尾
      if (c0 === '合計') continue;
      if (/^承/.test(item)) { if (carry === null && /月份/.test(item)) carry = num(r[C.amt]); continue; }
      const dv = r[C.date];
      if (dv instanceof Date) cur = ymd(dv);
      else if (c0) { const m = c0.match(/(\d{1,2})\s*[月\/]\s*(\d{1,2})/); if (m && ym) cur = `${ym.slice(0, 4)}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; }
      if (!item && num(r[C.amt]) == null) continue;
      if (!cur) continue;
      const v = k => C[k] >= 0 ? String(r[C[k]] ?? '').trim() : '';
      out.push({ date: cur, item, amount: v('amt'), recv: v('recv'), handler: v('hand'), note: v('note'), cost: v('cost'), phone: v('phone'), ticket: v('ticket'), seq: seq++ });
    }
  });
  if (!ym && out.length) ym = out[0].date.slice(0, 7);
  return { branch, ym, carry, rows: out.filter(r => r.date.slice(0, 7) === ym) };
}

async function importXlsx(file) {
  if (!window.XLSX) return toast('⚠️ 函式庫載入中，請稍候');
  const p = parseLedgerXlsx(await file.arrayBuffer());
  if (!p.rows.length) return toast('⚠️ 讀不到資料，請確認是「銷售報表」格式的 Excel');
  const branch = p.branch || $('branch').value, key = `${branch}_${p.ym}`;
  const existing = await getDocs(query(collection(db, 'ledger'), where('bm', '==', key)));
  const sales = p.rows.filter(r => !isExpense(r)).reduce((a, r) => a + (num(r.amount) ?? 0), 0);
  let msg = `📥 ${file.name}\n\n分店：${branch}${p.branch ? '' : '（偵測不到，使用目前選的分店）'}\n月份：${p.ym}\n共 ${p.rows.length} 列（${new Set(p.rows.map(r => r.date)).size} 天）\n承上月金額：${p.carry ?? '（未偵測到）'}\n營收合計：${fmt(sales)}`;
  if (!existing.empty) msg += `\n\n⚠️ 這個月在登打頁已經有 ${existing.size} 筆資料，按「確定」會先刪除這 ${existing.size} 筆，換成 Excel 的內容。`;
  if (!await ask(msg + '\n\n確定匯入？')) return;
  setSync('匯入中…');
  try {
    // 0. 先備份：這個月原本的登打資料、它們建立的保固紀錄、承上月金額 → 之後可按「還原上次匯入」
    setSync('備份中…');
    const bakId = `${key}_${Date.now()}`, bakNow = new Date().toISOString();
    const oldMeta = await getDoc(doc(db, 'ledger_meta', key));
    const bakDocs = existing.docs.map(d => ({ kind: 'row', id: d.id, data: d.data() }));
    const linked = existing.docs.filter(d => !d.data().imported).map(d => 'L' + d.id);
    for (let i = 0; i < linked.length; i += 30) {
      (await Promise.all(linked.slice(i, i + 30).map(id => getDoc(doc(db, 'records', id))))).forEach(r => { if (r.exists()) bakDocs.push({ kind: 'rec', id: r.id, data: r.data() }); });
    }
    for (let i = 0; i < bakDocs.length; i += 400) {
      const b = writeBatch(db);
      bakDocs.slice(i, i + 400).forEach(x => b.set(doc(db, 'ledger_bak_rows', `${bakId}__${x.kind}__${x.id}`), { bak: bakId, kind: x.kind, id: x.id, json: JSON.stringify(x.data) }));
      await b.commit();
    }
    await setDoc(doc(db, 'ledger_bak', key), { bakId, key, ts: bakNow, by: auth.currentUser.email, file: file.name,
      hadMeta: oldMeta.exists(), carryBefore: oldMeta.exists() ? (oldMeta.data().carry ?? null) : null, rows: existing.size, recs: bakDocs.length - existing.size, added: [], done: false });
    setSync('匯入中…');
    // 1. 清掉該月舊資料（含它們自動建立的保固紀錄）
    const del = existing.docs;
    for (let i = 0; i < del.length; i += 200) {
      const b = writeBatch(db);
      del.slice(i, i + 200).forEach(d => { b.delete(d.ref); if (!d.data().imported) b.delete(doc(db, 'records', 'L' + d.id)); });
      await b.commit();
    }
    // 2. 寫入登打資料
    const now = new Date().toISOString(), me = auth.currentUser.email, base = Date.parse(p.ym + '-01T00:00:00');
    const list = p.rows.map(r => ({ id: newId(), bm: key, branch, date: r.date, order: base + r.seq, item: r.item, amount: r.amount, recv: r.recv, handler: r.handler,
      note: r.note, cost: r.cost, phone: r.phone, ticket: r.ticket, imported: true, importFile: file.name, createdAt: now, createdBy: me, updatedAt: now, updatedBy: me }));
    for (let i = 0; i < list.length; i += 400) {
      const b = writeBatch(db);
      list.slice(i, i + 400).forEach(({ id, ...d }) => b.set(doc(db, 'ledger', id), d));
      await b.commit();
    }
    if (p.carry != null) await setDoc(doc(db, 'ledger_meta', key), { carry: p.carry, updatedAt: now, updatedBy: me }, { merge: true });
    // 3. 補保固紀錄（同電話＋同保固起算日＋同品項已存在就略過）
    const have = new Set();
    const phones = [...new Set(list.map(r => normPhone(r.phone)).filter(p => /^09\d{8}$/.test(p)))];
    for (let i = 0; i < phones.length; i += 30) {   // 只查這份報表裡出現的電話
      (await getDocs(query(collection(db, 'records'), where('phone', 'in', phones.slice(i, i + 30))))).forEach(d => { const x = d.data(); have.add(`${x.phone}_${x.repairDate}_${x.type}`); });
    }
    const toAdd = [];
    list.forEach(r => {
      const phone = normPhone(r.phone);
      if (!/^09\d{8}$/.test(phone) || !r.item || (isExpense(r) && !isRefund(r))) return;
      const repairDate = dateFromType(r.item, r.date) || r.date;
      let rec = { branch, repairDate, bookedDate: r.date, name: (r.ticket || '').replace(/[RS]$/, '') || '（未填）', phone, type: r.item,
        ...warrantyFields(parseItems(r.item), 0), price: r.amount, note: r.note, careManual: false, source: 'excel', importFile: file.name, createdAt: now, createdBy: me };
      if (isRefund(r)) rec = refundRecord(rec, r.date);
      const k = `${phone}_${rec.repairDate}_${r.item}`;
      if (have.has(k)) return; have.add(k); toAdd.push(rec);
    });
    const addedIds = [];
    for (let i = 0; i < toAdd.length; i += 400) {
      const b = writeBatch(db);
      toAdd.slice(i, i + 400).forEach(rec => { const ref = doc(collection(db, 'records')); addedIds.push(ref.id); b.set(ref, rec); });
      await b.commit();
    }
    await setDoc(doc(db, 'ledger_bak', key), { added: addedIds, done: true }, { merge: true });
    if ($('branch').value !== branch) { $('branch').value = branch; lsSet('ledgerBranch', branch); }
    $('month').value = p.ym; load();
    toast(`✅ 匯入 ${list.length} 列；保固紀錄新增 ${toAdd.length} 筆（其餘已存在）`);
  } catch (er) { setSync('⚠️ 匯入失敗'); toast('⚠️ 匯入失敗：' + er.message); }
}

/* ─── 還原上次匯入：把這個月恢復成匯入前的樣子 ─── */
async function checkUndo() {
  try { const m = await getDoc(doc(db, 'ledger_bak', bm())); $('undoImp').classList.toggle('hidden', !m.exists()); }
  catch { $('undoImp').classList.add('hidden'); }
}
$('undoImp').onclick = async () => {
  const key = bm(), m = await getDoc(doc(db, 'ledger_bak', key));
  if (!m.exists()) { toast('這個月沒有可還原的匯入'); return checkUndo(); }
  const x = m.data(), when = new Date(x.ts).toLocaleString('zh-TW', { hour12: false });
  if (!await ask(`↩️ 還原 ${key.replace('_', ' ')} 的匯入？

匯入檔案：${x.file}
匯入時間：${when}

會刪除匯入進來的資料（含它新增的 ${(x.added || []).length} 筆保固紀錄），
恢復成匯入前的 ${x.rows} 列登打資料${x.recs ? '與 ' + x.recs + ' 筆保固紀錄' : ''}、承上月金額。

匯入之後在這個月新打的資料也會一起被清掉。`)) return;
  setSync('還原中…');
  try {
    // 1. 刪掉現在這個月的資料（含它們建立的保固紀錄）
    const cur = await getDocs(query(collection(db, 'ledger'), where('bm', '==', key)));
    const dels = [];
    cur.docs.forEach(d => { dels.push(d.ref); if (!d.data().imported) dels.push(doc(db, 'records', 'L' + d.id)); });
    (x.added || []).forEach(id => dels.push(doc(db, 'records', id)));
    for (let i = 0; i < dels.length; i += 400) { const b = writeBatch(db); dels.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
    // 2. 放回備份
    const bak = await getDocs(query(collection(db, 'ledger_bak_rows'), where('bak', '==', x.bakId)));
    for (let i = 0; i < bak.docs.length; i += 400) {
      const b = writeBatch(db);
      bak.docs.slice(i, i + 400).forEach(d => { const y = d.data(); b.set(doc(db, y.kind === 'rec' ? 'records' : 'ledger', y.id), JSON.parse(y.json)); });
      await b.commit();
    }
    // 3. 承上月金額
    if (x.hadMeta) await setDoc(doc(db, 'ledger_meta', key), { carry: x.carryBefore, updatedAt: new Date().toISOString(), updatedBy: auth.currentUser.email }, { merge: true });
    else await deleteDoc(doc(db, 'ledger_meta', key));
    // 4. 清掉備份
    for (let i = 0; i < bak.docs.length; i += 400) { const b = writeBatch(db); bak.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
    await deleteDoc(doc(db, 'ledger_bak', key));
    load(); toast(`✅ 已還原成匯入前（${x.rows} 列）`);
  } catch (er) { setSync('⚠️ 還原失敗'); toast('⚠️ 還原失敗：' + er.message); }
};

// 匯總（月報：每天一列；年報：每月一列），含分類統計
function summarize(rowsArr) {
  const sales = rowsArr.filter(r => !isExpense(r) && !isRefund(r) && (num(r.amount) ?? 0) > 0 && statCat(r.item) !== '其他收入');
  const other = rowsArr.filter(r => !isExpense(r) && !isRefund(r) && (num(r.amount) ?? 0) > 0 && statCat(r.item) === '其他收入');
  const out = rowsArr.filter(r => isExpense(r) || isRefund(r));
  const S = a => a.reduce((x, r) => x + (num(r.amount) ?? 0), 0);
  const P = a => a.reduce((x, r) => x + (profit(r) ?? 0), 0);
  return { n: sales.length, rev: S(sales), other: S(other), exp: S(out), net: S(rowsArr), prof: P(sales) + P(out.filter(isRefund)) };
}
function catTable(rowsArr) {
  const g = {};
  rowsArr.filter(r => !isExpense(r) && !isRefund(r) && (num(r.amount) ?? 0) > 0).forEach(r => {
    const c = statCat(r.item); if (c === '其他收入') return;
    (g[c] ||= { c, n: 0, rev: 0, prof: 0 }); g[c].n++; g[c].rev += num(r.amount) ?? 0; g[c].prof += profit(r) ?? 0;
  });
  return Object.values(g).sort((a, b) => b.rev - a.rev);
}

        `<div style="flex:1;border:1px solid #ddd;border-radius:8px;padding:7px 10px"><div style="font-size:12px;color:#666">${k}</div><div style="font-size:21px;font-weight:800">${typeof v === 'number' ? fmt(v) : v}</div></div>`).join('')}
    </div>
    <table style="border-collapse:collapse;width:100%;font-size:14px">
      <tr style="background:#f1f1f1;font-weight:700;text-align:center">${['期間', '筆數', '銷售收入', '支出／退修', '其他收入', '收支合計', '毛利', '毛利率', '結餘'].map(x => c(x)).join('')}</tr>
      ${lines.map(l => `<tr>${c(l.label, 'text-align:center')}${c(l.n, 'text-align:center')}${c(fmt(l.rev), R)}${c(fmt(l.exp), R + (l.exp < 0 ? ';color:#c00' : ''))}${c(l.other ? fmt(l.other) : '', R)}${c(fmt(l.net), R)}${c(fmt(l.prof), R)}${c(pct(l.prof, l.rev), R)}${c(l.bal == null ? '' : fmt(l.bal), R)}</tr>`).join('')}
      <tr style="font-weight:800;background:#fafafa">${c('合計', 'text-align:center')}${c(totals.n, 'text-align:center')}${c(fmt(totals.rev), R)}${c(fmt(totals.exp), R)}${c(totals.other ? fmt(totals.other) : '', R)}${c(fmt(totals.net), R)}${c(fmt(totals.prof), R)}${c(pct(totals.prof, totals.rev), R)}${c(open == null ? '' : fmt(open + totals.net), R)}</tr>
    </table>

      ${cats.map(k => `<tr>${c(k.c)}${c(k.n, 'text-align:center')}${c(fmt(k.rev), R)}${c(pct(k.rev, totals.rev), R)}${c(fmt(k.prof), R)}${c(pct(k.prof, k.rev), R)}</tr>`).join('')}</table>` : ''}
    <div style="font-size:12px;color:#888;margin-top:10px;text-align:right">復原者 每日登打系統產生　${new Date().toLocaleString('zh-TW', { hour12: false })}</div></div>`;

// 多錢以虛擬列加入（品項「多錢」、不算銷售），月報／年報的結餘才會跟帳上一致
const extraRows = (branch, cmap) => Object.entries(cmap).filter(([, c]) => num(c.extra)).map(([d, c]) => ({ date: d, branch, item: '支出:多錢（點錢調整）', amount: String(num(c.extra)), _extra: true }));
async function fetchMonth(branch, ym) {
  if (branch === $('branch').value && ym === $('month').value) return { rows: Object.values(rows).concat(extraRows(branch, cash)), carry: num($('carry').value) };
  const [snap, meta, cs] = await Promise.all([getDocs(query(collection(db, 'ledger'), where('bm', '==', `${branch}_${ym}`))), getDoc(doc(db, 'ledger_meta', `${branch}_${ym}`)),
    getDocs(query(collection(db, 'ledger_cash'), where('bm', '==', `${branch}_${ym}`)))]);
  const cmap = {}; cs.forEach(d => { const x = d.data(); cmap[x.date] = x; });
  return { rows: snap.docs.map(d => d.data()).concat(extraRows(branch, cmap)), carry: meta.exists() ? Number(meta.data().carry || 0) : null };
}
async function buildReport(kind, branchSel, ym, year) {
  const brs = branchSel === 'both' ? ['楠梓店', '德賢店'] : [$('branch').value];
  const unit = branchSel === 'both' ? '復原者楠梓店＋德賢店' : '復原者' + $('branch').value;
  if (kind === 'month') {
    const data = await Promise.all(brs.map(b => fetchMonth(b, ym)));
    const all = data.flatMap(d => d.rows).filter(r => String(r.item || '').trim() || num(r.amount) != null);
    if (!all.length) return null;
    const open = data.every(d => d.carry != null) ? data.reduce((a, d) => a + d.carry, 0) : null;
    let bal = open;
    const days = [...new Set(all.map(r => r.date))].sort();
    const lines = days.map(d => { const t = summarize(all.filter(r => r.date === d)); if (bal != null) bal += t.net; const dt = new Date(d + 'T00:00:00');
      return { label: `${dt.getMonth() + 1}/${dt.getDate()}（${WD[dt.getDay()]}）`, ...t, bal }; });
    const [y, m] = ym.split('-').map(Number);
    return { html: reportHTML('銷售月報', `${y} 年 ${m} 月`, unit, lines, summarize(all), catTable(all), open), name: `銷售月報_${branchSel === 'both' ? '兩店' : $('branch').value}_${ym}`, lines, all };
  }
  const months = Array.from({ length: 12 }, (_, i) => `${year}-${String(i + 1).padStart(2, '0')}`);
  const data = await Promise.all(months.map(async ym2 => ({ ym: ym2, list: await Promise.all(brs.map(b => fetchMonth(b, ym2))) })));
  const all = [], lines = [];
  data.forEach(({ ym: ym2, list }) => {
    const rs = list.flatMap(d => d.rows).filter(r => String(r.item || '').trim() || num(r.amount) != null);
    if (!rs.length) return;
    all.push(...rs);
    const open = list.every(d => d.carry != null) ? list.reduce((a, d) => a + d.carry, 0) : null;
    const t = summarize(rs);
    lines.push({ label: `${Number(ym2.slice(5))} 月`, ...t, bal: open == null ? null : open + t.net });
  });
  if (!all.length) return null;
  return { html: reportHTML('銷售年報', `${year} 年`, unit, lines, summarize(all), catTable(all), null), name: `銷售年報_${branchSel === 'both' ? '兩店' : $('branch').value}_${year}`, lines, all };
}
function reportXlsx(rep, kind) {
  const wb = XLSX.utils.book_new();
  const head = ['期間', '筆數', '銷售收入', '支出／退修', '其他收入', '收支合計', '毛利', '毛利率', '結餘'];
  const t = summarize(rep.all);
  const A = [head, ...rep.lines.map(l => [l.label, l.n, l.rev, l.exp, l.other, l.net, l.prof, l.rev ? Math.round(l.prof / l.rev * 1000) / 10 + '%' : '', l.bal ?? '']),
    ['合計', t.n, t.rev, t.exp, t.other, t.net, t.prof, t.rev ? Math.round(t.prof / t.rev * 1000) / 10 + '%' : '']];
  const ws1 = XLSX.utils.aoa_to_sheet(A); ws1['!cols'] = [{ wch: 12 }, { wch: 6 }, ...Array(7).fill({ wch: 11 })];
  XLSX.utils.book_append_sheet(wb, ws1, kind === 'month' ? '每日彙總' : '每月彙總');
  const C = [['分類', '件數', '銷售收入', '毛利'], ...catTable(rep.all).map(k => [k.c, k.n, k.rev, k.prof])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(C), '品項分類');
  const D = [['日期', '分店', '售出品項', '金額', '接待', '經手', '備註', '成本', '毛利', '連絡電話', '單號'],
    ...rep.all.slice().sort((a, b) => (a.date + (a.order || 0)).localeCompare(b.date + (b.order || 0))).map(r => [r.date, r.branch, r.item, num(r.amount) ?? '', r.recv, r.handler, r.note, num(r.cost) ?? '', profit(r) ?? '', r.phone, r.ticket])];
  const ws3 = XLSX.utils.aoa_to_sheet(D); ws3['!cols'] = [{ wch: 11 }, { wch: 7 }, { wch: 50 }, ...Array(8).fill({ wch: 10 })];
  XLSX.utils.book_append_sheet(wb, ws3, '明細');
  XLSX.writeFile(wb, rep.name + '.xlsx');
}

};

/* ─── 列印／匯出：照原本 Excel「銷售報表」格式 ─── */
const PER_PAGE = 55;   // 每頁內容列數（加上表頭、承前、合計、零用金 = 63 格）
function buildPages(fromDate) {
  const carry = num($('carry').value) ?? 0;
  const lines = [];
  daysList().forEach(d => {
    const rs = dayRows(d).filter(r => String(r.item || '').trim() || num(r.amount) != null);
    if (!rs.length) return;
    const dt = new Date(d + 'T00:00:00');
    rs.forEach((r, i) => lines.push({ k: 'row', d, date: i === 0 ? `${dt.getMonth() + 1}月${dt.getDate()}日` : '', r }));
    if (extraOf(d)) lines.push({ k: 'row', d, date: '', r: { item: '多錢', amount: String(extraOf(d)), recv: '', handler: '', note: '點錢多出', cost: '', phone: '', ticket: '' }, extraRow: true });
    lines.push({ k: 'tot', d, sum: rs.reduce((a, r) => a + (num(r.amount) ?? 0), 0) + extraOf(d), prof: rs.reduce((a, r) => a + (profit(r) ?? 0), 0) });
  });
  const pages = []; let bal = carry;
  for (let i = 0; i < lines.length || i === 0; i += PER_PAGE) {
    const chunk = lines.slice(i, i + PER_PAGE);
    const open = bal;
    chunk.forEach(l => { if (l.k === 'row') bal += num(l.r.amount) ?? 0; });
    pages.push({ open, close: bal, lines: chunk, first: i === 0 });
    if (!lines.length) break;
  }
  return fromDate ? pages.filter(p => p.lines.some(l => l.d >= fromDate)) : pages;
}
function monthLabel() { const [y, m] = $('month').value.split('-'); return { y, m: Number(m) }; }

let pagesRef = [];
function printHTML(pages) {
  pagesRef = pages;
  const { y, m } = monthLabel(), br = $('branch').value;
  const pm = m === 1 ? 12 : m - 1;
  const col = '<colgroup><col style="width:8%"><col style="width:37%"><col style="width:7.5%"><col style="width:4.5%"><col style="width:4.5%"><col style="width:8.5%"><col style="width:6%"><col style="width:6%"><col style="width:10%"><col style="width:8%"></colgroup>';
  const cell = (v, cls = '') => `<td class="${cls}">${esc(v ?? '')}</td>`;
  const money = v => v == null || v === '' ? '' : fmt(v);
  return pages.map(p => {
    let h = `<div class="pg"><h1>銷售報表</h1><div class="unit"><span>單位：復原者${esc(br)}</span><span>${y}年${m}月</span></div><table>${col}`;
    h += `<tr class="th">${['日期', '售出品項', '金額', '接待人', '經手人', '備註', '成本', '毛利', '連絡電話', '單號'].map(x => cell(x, 'c')).join('')}</tr>`;
    h += `<tr>${cell('')}${cell(p.first ? `承${pm}月份金額` : '承前盈餘')}${cell(money(p.open), 'r')}${cell('').repeat(7)}</tr>`;
    p.lines.forEach(l => {
      if (l.k === 'tot') h += `<tr class="tot">${cell('合計', 'c')}${cell('')}${cell('')}${cell('')}${cell('')}${cell(money(l.sum), 'r')}${cell('')}${cell(money(l.prof), 'r')}${cell('')}${cell('')}</tr>`;
      else {
        const r = l.r, a = num(r.amount);
        h += `<tr>${cell(l.date, 'c')}${cell(r.item)}<td class="r${a < 0 ? ' neg' : ''}">${money(a)}</td>${cell(r.recv, 'c')}${cell(r.handler, 'c')}${cell(r.note)}${cell(money(num(r.cost)), 'r')}${cell(l.extraRow ? '' : money(profit(r)), 'r')}${cell(r.phone)}${cell(r.ticket)}</tr>`;
      }
    });
    for (let i = p.lines.length; i < PER_PAGE; i++) h += `<tr>${cell('').repeat(10)}</tr>`;
    h += `<tr class="tot">${cell('合計', 'c')}${cell('')}${cell(money(p.close), 'r')}${cell('').repeat(7)}</tr>`;
    h += `<tr>${cell('零用金', 'c')}${cell('').repeat(9)}</tr>`;
    const lastD = p.lines.filter(l => l.d).at(-1)?.d;
    if (p === pagesRef.at(-1) && lastD && num(cash[lastD]?.drawer) != null) {
      const sf = effSafe(lastD) ?? 0, dr = num(cash[lastD].drawer), df = sf + dr - p.close;
      h += `<tr>${cell('')}${cell('保險櫃')}${cell(money(sf), 'r')}${cell('').repeat(7)}</tr><tr>${cell('')}${cell('現金')}${cell(money(dr), 'r')}${cell('').repeat(7)}</tr><tr>${cell('')}${cell(df === 0 ? '相符' : df > 0 ? '多錢' : '少錢')}${cell(money(df), 'r')}${cell('').repeat(7)}</tr>`;
    }
    h += `<tr class="tot">${cell('合計', 'c')}${cell('')}${cell(money(p.close), 'r')}${cell('').repeat(7)}</tr>`;
    return h + '</table></div>';
  }).join('');
}

$('printBtn').onclick = () => {
  const today = ymd(new Date());
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h3>🖨 列印銷售報表</h3>
    <label><input type="radio" name="pr" value="all" checked> 整個月（${$('month').value}）</label>
    <label><input type="radio" name="pr" value="from"> 從這天所在的頁開始：<input type="date" id="prFrom" value="${today}" style="border:1px solid #ccc;border-radius:6px;padding:3px"></label>
    <p class="hint" style="margin:8px 0 12px">格式與原本 Excel 相同（A4 直式、每頁 63 格、每天有合計、頁尾結餘）。</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="prNo">取消</button><button class="btn" id="prGo">列印</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#prNo').onclick = () => m.remove();
  m.querySelector('#prGo').onclick = () => {
    const from = m.querySelector('input[name=pr]:checked').value === 'from' ? m.querySelector('#prFrom').value : '';
    $('print').innerHTML = printHTML(buildPages(from)); m.remove();
    setTimeout(() => window.print(), 100);
  };
};

$('xlsxBtn').onclick = () => {
  if (!window.XLSX) return toast('⚠️ 函式庫載入中，請稍候');
  const { y, m } = monthLabel(), br = $('branch').value, pm = m === 1 ? 12 : m - 1;
  const wb = XLSX.utils.book_new();
  buildPages('').forEach((p, idx) => {
    const A = [[], ['', '', '銷   售   報   表'], ['', '', `  單位：復原者${br}`, '', '', '', '', `${y}年${m}月`],
      ['', '', '日期', '售    出    品    項', '金    額', '接待人', '經手人    ', '備    註', '成本', '毛利', '連絡電話', '單號'],
      ['', '', '', p.first ? `承${pm}月份金額` : '承前盈餘', p.open]];
    p.lines.forEach(l => {
      if (l.k === 'tot') A.push(['', '', '合計', '', '', '', '', l.sum, '', l.prof]);
      else { const r = l.r; A.push(['', '', l.date, r.item || '', num(r.amount) ?? '', num(r.recv) ?? r.recv ?? '', num(r.handler) ?? r.handler ?? '', r.note || '', num(r.cost) ?? '', profit(r) ?? '', r.phone || '', r.ticket || '']); }
    });
    while (A.length < 5 + PER_PAGE) A.push([]);
    A.push(['', '', '合計', '', p.close]); A.push(['', '', '零用金']); A.push(['', '', '合計', '', p.close]);
    const ws = XLSX.utils.aoa_to_sheet(A);
    ws['!cols'] = [{ wch: 5 }, { wch: 3 }, { wch: 10 }, { wch: 68 }, { wch: 12 }, { wch: 7 }, { wch: 8 }, { wch: 18 }, { wch: 9 }, { wch: 9 }, { wch: 13 }, { wch: 12 }];
    ws['!merges'] = [{ s: { r: 1, c: 2 }, e: { r: 1, c: 7 } }, { s: { r: 2, c: 2 }, e: { r: 2, c: 3 } }];
    Object.keys(ws).forEach(k => { if (/^K\d+$/.test(k) && ws[k].v) { ws[k].t = 's'; ws[k].v = String(ws[k].v); } });
    XLSX.utils.book_append_sheet(wb, ws, '匯整' + (idx + 1));
  });
  XLSX.writeFile(wb, `${y}年${m}月 銷售報表（${br}）.xlsx`);
};
</script>
