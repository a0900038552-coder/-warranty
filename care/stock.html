<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>復原者 中古機庫存</title>
<style>
:root{--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--red:#d71920;--green:#15803d;--blue:#2a78d6;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px}
.login-box input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:9px 10px;margin-bottom:10px}
header{background:var(--ink);color:#fff;padding:10px 16px;border-bottom:4px solid var(--red);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.logo{font-weight:900;font-size:16px;margin-right:auto}.logo small{display:block;font-weight:400;font-size:11px;color:#a1a6b0;letter-spacing:2px}
.hbtn{background:none;border:1px solid #555;color:#ddd;border-radius:8px;padding:5px 11px;cursor:pointer;text-decoration:none;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:12px 12px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:200px;border:1px solid #d1d5db;border-radius:10px;padding:9px 12px;font-size:15px}
.bar select{border:1px solid #d1d5db;border-radius:8px;padding:7px 8px;background:#fff}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tiles div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tiles small{display:block;color:var(--mute);font-size:12px}.tiles b{font-size:20px;font-variant-numeric:tabular-nums}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafafa;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c{text-align:center}
tr.row:hover{background:#f9fafb}
td input[type=text]{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:4px 6px;min-width:90px}
td input.imei{font-family:ui-monospace,Consolas,monospace;min-width:150px}
td input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--green)}
td select{border:1px solid #e5e7eb;border-radius:6px;padding:3px 4px;background:#fff}
.model{font-weight:800}
.mute{color:var(--mute);font-size:12px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:700}
.pill.stock{background:#e6f0fb;color:var(--blue)}.pill.sold{background:#dcfce7;color:var(--green)}.pill.other{background:#f3f4f6;color:var(--mute)}
.pill.old{background:#fee2e2;color:var(--red)}
.warn{color:var(--amber);font-size:12px}
.more{border:0;background:none;color:var(--blue);cursor:pointer;font-size:12px;white-space:nowrap}
tr.detail td{background:#fafbfc}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:6px 2px}
.dgrid label{display:block;font-size:12px;color:var(--mute)}
.dgrid input,.dgrid select,.dgrid textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
.dgrid textarea{min-height:60px}
.hint{color:var(--mute);font-size:12px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:99}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<section id="login" class="hidden">
  <form class="login-box" id="loginForm"><h3 style="margin-bottom:12px">復原者 中古機庫存</h3>
    <input name="email" type="email" placeholder="帳號（Email）" required><input name="pw" type="password" placeholder="密碼" required>
    <button class="hbtn" style="width:100%;background:var(--ink);color:#fff;padding:9px">登入</button></form>
</section>
<section id="app" class="hidden">
  <header><div class="hd">
    <div class="logo">📱 中古機庫存<small>USED PHONE STOCK</small></div>
    <a class="hbtn" href="ledger.html">📝 每日登打</a><a class="hbtn" href="quotes.html">💰 報價</a><a class="hbtn" href="./">← 保固系統</a>
  </div></header>
  <main>
    <div class="bar">
      <input type="search" id="q" placeholder="搜尋機型、IMEI、機況…">
      <span class="seg" id="segS"><button data-k="stock" class="on">在庫</button><button data-k="sold">已售出</button><button data-k="all">全部</button></span>
      <select id="br"><option value="">兩店</option><option>楠梓店</option><option>德賢店</option></select>
      <button class="hbtn" id="reload" style="color:var(--ink);border-color:#d1d5db;background:#fff">↻ 重新整理</button>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="panel"><table>
      <thead><tr><th>收購日</th><th>分店</th><th>機型</th><th style="text-align:right">收購成本</th><th>狀態</th>
        <th>IMEI</th><th>機況</th><th style="text-align:center">氣密</th><th style="text-align:center">盒裝</th><th style="text-align:center">原廠線</th><th></th></tr></thead>
      <tbody id="list"><tr><td colspan="11" class="mute" style="padding:16px">讀取中…</td></tr></tbody>
    </table></div>
    <p class="hint">
      📥 <b>自動進庫存</b>：每日登打寫「支出:中古機回收:機型」（例：支出:中古機回收:14 PRO 256G，金額 -8000）就會出現在這裡，收購成本＝那一列的金額。<br>
      ✅ <b>自動標成已售出</b>：之後登打「機型 中古機」（例：14 PRO 256G 中古機，成本 -8000），機型和成本對得上就會自動配對，顯示售價與毛利。對不上的可在「詳細」裡手動改狀態。<br>
      ✏️ IMEI、機況、氣密／盒裝／原廠線打勾後會自動儲存。
    </p>
  </main>
</section>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp({ apiKey: "AIzaSyD04ZMXIt8Oo3hjm5qsMaKiLXYzp_9YKwA", authDomain: "care-warranty.firebaseapp.com", projectId: "care-warranty",
  storageBucket: "care-warranty.firebasestorage.app", messagingSenderId: "29512690431", appId: "1:29512690431:web:f0c2dd1cd6acb03d197aca" });
const auth = getAuth(app), db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null || isNaN(n) ? '' : '$' + Math.round(n).toLocaleString('en-US');
const num = v => { const n = Number(String(v ?? '').replace(/[,$\s]/g, '')); return String(v ?? '').trim() === '' || isNaN(n) ? null : n; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const days = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }

// 機型比對用：大寫、去空白、去 iPhone 字樣
const mkey = s => String(s || '').toUpperCase().replace(/IPHONE/g, '').replace(/[\s\-_/／]+/g, '');
const BUY_RE = /^\s*支出\s*[:：]\s*中古機回收\s*[:：]?\s*/;
const isBuy = r => BUY_RE.test(r.item || '');
const buyModel = r => String(r.item || '').replace(BUY_RE, '').trim();
// 售出列：品項有「中古機」，但不是支出、損料、盒裝、回收
const isSale = r => /中古機/.test(r.item || '') && !/^\s*支出/.test(r.item) && !/損料|盒裝|回收/.test(r.item);
const saleModel = r => String(r.item || '').split('中古機')[0].trim();

let buys = [], sales = [], details = {}, scope = 'stock', open = null, unsubD = null;
onAuthStateChanged(auth, u => { $('login').classList.toggle('hidden', !!u); $('app').classList.toggle('hidden', !u); if (u) start(); });
$('loginForm').onsubmit = async e => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, e.target.email.value.trim(), e.target.pw.value); } catch { toast('⚠️ 登入失敗'); } };

async function start() {
  if (!unsubD) unsubD = onSnapshot(collection(db, 'used_stock'), s => { s.docs.forEach(d => details[d.id] = d.data()); render(); });
  await loadLedger();
}
async function loadLedger() {
  $('list').innerHTML = '<tr><td colspan="11" class="mute" style="padding:16px">讀取中…</td></tr>';
  // 1. 所有收購列（品項開頭「支出:中古機回收」或全形冒號）
  const qs = ['支出:中古機回收', '支出：中古機回收'].map(p => getDocs(query(collection(db, 'ledger'), where('item', '>=', p), where('item', '<', p + ''))));
  buys = (await Promise.all(qs)).flatMap(s => s.docs.map(d => ({ id: d.id, ...d.data() }))).filter(isBuy);
  // 2. 售出列：從最早一台收購的月份到這個月（兩店）
  const first = buys.map(b => b.date).sort()[0] || ymd(new Date());
  const months = []; for (let d = new Date(first.slice(0, 7) + '-01T00:00:00'); d <= new Date(); d.setMonth(d.getMonth() + 1)) months.push(ymd(d).slice(0, 7));
  const bms = months.slice(-18).flatMap(m => ['楠梓店', '德賢店'].map(b => `${b}_${m}`));
  const parts = []; for (let i = 0; i < bms.length; i += 30) parts.push(getDocs(query(collection(db, 'ledger'), where('bm', 'in', bms.slice(i, i + 30)))));
  sales = (await Promise.all(parts)).flatMap(s => s.docs.map(d => ({ id: d.id, ...d.data() }))).filter(isSale);
  render();
}

// 自動配對：同機型（開頭相同即可，例 RENO 12F ↔ RENO 12F 128G）、售出日不早於收購日；成本相同的優先
function match() {
  const used = new Set(), res = {};
  Object.values(details).forEach(d => { if (d.saleId) used.add(d.saleId); });
  [...buys].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(b => {
    const d = details[b.id] || {};
    if (d.status && d.status !== 'auto') { res[b.id] = { status: d.status, sale: sales.find(s => s.id === d.saleId) || null, manual: true }; return; }
    const k = mkey(buyModel(b)), cost = Math.abs(num(b.amount) ?? 0);
    const cands = sales.filter(s => !used.has(s.id) && (s.date || '') >= (b.date || '') && (() => { const sk = mkey(saleModel(s)); return sk && k && (sk === k || sk.startsWith(k) || k.startsWith(sk)); })());
    const same = cands.find(s => Math.abs(num(s.cost) ?? NaN) === cost);
    const pick = same || (cands.length === 1 ? cands[0] : null);
    if (pick) { used.add(pick.id); res[b.id] = { status: 'sold', sale: pick, costDiff: !same }; }
    else res[b.id] = { status: 'stock', sale: null };
  });
  return res;
}

const STATUS = { auto: '自動判斷', stock: '在庫', sold: '已售出', returned: '退回／轉賣同行', own: '自用／拆零件' };
function render() {
  if (!buys.length && !Object.keys(details).length) { $('list').innerHTML = '<tr><td colspan="11" class="mute" style="padding:16px">還沒有收購紀錄。每日登打寫「支出:中古機回收:機型」就會出現在這裡。</td></tr>'; $('tiles').innerHTML = ''; return; }
  const m = match(), today = ymd(new Date()), q = $('q').value.trim().toLowerCase(), br = $('br').value;
  const rows = buys.map(b => ({ b, d: details[b.id] || {}, m: m[b.id] }))
    .filter(x => !br || x.b.branch === br)
    .sort((a, b) => (b.b.date || '').localeCompare(a.b.date || ''));
  const inStock = rows.filter(x => x.m.status === 'stock');
  const monthSold = rows.filter(x => x.m.status === 'sold' && x.m.sale && (x.m.sale.date || '').slice(0, 7) === today.slice(0, 7));
  const soldProfit = monthSold.reduce((a, x) => a + (num(x.m.sale.amount) ?? 0) - Math.abs(num(x.b.amount) ?? 0), 0);
  const avgDays = inStock.length ? Math.round(inStock.reduce((a, x) => a + days(x.b.date, today), 0) / inStock.length) : 0;
  $('tiles').innerHTML = `
    <div><small>在庫台數</small><b>${inStock.length}</b></div>
    <div><small>在庫成本合計</small><b>${money(inStock.reduce((a, x) => a + Math.abs(num(x.b.amount) ?? 0), 0))}</b></div>
    <div><small>平均庫存天數</small><b>${avgDays} 天</b></div>
    <div><small>本月售出</small><b>${monthSold.length} 台</b></div>
    <div><small>本月售出毛利</small><b style="color:var(--green)">${money(soldProfit)}</b></div>`;
  const shown = rows.filter(x => scope === 'all' || (scope === 'stock' ? x.m.status === 'stock' : x.m.status === 'sold'))
    .filter(x => !q || [buyModel(x.b), x.d.imei, x.d.cond, x.d.color, x.d.note, x.m.sale?.item].join(' ').toLowerCase().includes(q));
  if (!shown.length) { $('list').innerHTML = `<tr><td colspan="11" class="mute" style="padding:16px">${scope === 'stock' ? '目前沒有在庫的中古機。' : '沒有符合的資料。'}</td></tr>`; return; }
  $('list').innerHTML = shown.map(x => {
    const { b, d, m: mm } = x, cost = Math.abs(num(b.amount) ?? 0), age = days(b.date, today);
    let st;
    if (mm.status === 'sold' && mm.sale) {
      const p = (num(mm.sale.amount) ?? 0) - cost;
      st = `<span class="pill sold">已售 ${esc((mm.sale.date || '').slice(5).replace('-', '/'))}</span> <span class="mute">${money(num(mm.sale.amount))}・毛利 <b style="color:${p >= 0 ? 'var(--green)' : 'var(--red)'}">${money(p)}</b></span>${mm.costDiff ? '<br><span class="warn">⚠️ 售出那列的成本跟收購金額不同，請確認</span>' : ''}`;
    } else if (mm.status === 'sold') st = `<span class="pill sold">已售出</span>`;
    else if (mm.status === 'stock') st = `<span class="pill ${age > 30 ? 'old' : 'stock'}">在庫 ${age} 天</span>`;
    else st = `<span class="pill other">${STATUS[mm.status] || mm.status}</span>`;
    const det = open === b.id ? `<tr class="detail"><td colspan="11"><div class="dgrid">
        <div><label>顏色</label><input data-k="color" data-id="${b.id}" value="${esc(d.color)}" placeholder="例：遠峰藍"></div>
        <div><label>電池健康度（%）</label><input data-k="battery" data-id="${b.id}" value="${esc(d.battery)}" inputmode="numeric" placeholder="例：86"></div>
        <div><label>其他配件</label><input data-k="acc" data-id="${b.id}" value="${esc(d.acc)}" placeholder="例：原廠殼、發票"></div>
        <div><label>狀態</label><select data-k="status" data-id="${b.id}">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}"${(d.status || 'auto') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label>備註（賣家、收購原因、預計售價…）</label><textarea data-k="note" data-id="${b.id}">${esc(d.note)}</textarea></div>
        <div style="grid-column:1/-1" class="mute">登打原文：${esc(b.item)}　金額 ${esc(b.amount)}　${esc(b.note || '')}${mm.sale ? `<br>配對到的售出列：${esc(mm.sale.date)}　${esc(mm.sale.item)}　售價 ${esc(mm.sale.amount)}　成本 ${esc(mm.sale.cost)}` : ''}</div>
      </div></td></tr>` : '';
    return `<tr class="row">
      <td>${esc((b.date || '').slice(5).replace('-', '/'))}<br><span class="mute">${esc((b.date || '').slice(0, 4))}</span></td>
      <td>${esc(b.branch || '')}</td>
      <td><span class="model">${esc(buyModel(b))}</span>${d.color ? `<br><span class="mute">${esc(d.color)}</span>` : ''}</td>
      <td class="n">${money(cost)}</td>
      <td>${st}</td>
      <td><input type="text" class="imei" data-k="imei" data-id="${b.id}" value="${esc(d.imei)}" placeholder="IMEI" inputmode="numeric"></td>
      <td><input type="text" data-k="cond" data-id="${b.id}" value="${esc(d.cond)}" placeholder="例：9成新、背蓋小刮"></td>
      <td class="c"><input type="checkbox" data-k="waterproof" data-id="${b.id}"${d.waterproof ? ' checked' : ''} title="有氣密"></td>
      <td class="c"><input type="checkbox" data-k="box" data-id="${b.id}"${d.box ? ' checked' : ''} title="有盒裝"></td>
      <td class="c"><input type="checkbox" data-k="cable" data-id="${b.id}"${d.cable ? ' checked' : ''} title="有原廠線"></td>
      <td><button class="more" data-open="${b.id}">${open === b.id ? '收合 ▲' : '詳細 ▼'}</button></td></tr>${det}`;
  }).join('');
}

// 自動儲存（打字停 0.6 秒、勾選立刻存）
const timers = {};
function save(id, k, v) {
  details[id] = { ...(details[id] || {}), [k]: v };
  clearTimeout(timers[id + k]);
  timers[id + k] = setTimeout(async () => {
    try { await setDoc(doc(db, 'used_stock', id), { [k]: v, updatedAt: new Date().toISOString(), updatedBy: auth.currentUser.email }, { merge: true }); }
    catch (e) { toast('⚠️ 儲存失敗：' + e.message); }
  }, typeof v === 'boolean' || k === 'status' ? 0 : 600);
}
$('list').addEventListener('input', e => { const el = e.target; if (!el.dataset.k || el.type === 'checkbox' || el.tagName === 'SELECT') return; save(el.dataset.id, el.dataset.k, el.value.trim()); });
$('list').addEventListener('change', e => {
  const el = e.target; if (!el.dataset.k) return;
  if (el.type === 'checkbox') save(el.dataset.id, el.dataset.k, el.checked);
  else if (el.tagName === 'SELECT') { save(el.dataset.id, el.dataset.k, el.value); render(); }
});
$('list').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; open = open === b.dataset.open ? null : b.dataset.open; render(); });
$('segS').onclick = e => { const b = e.target.closest('button'); if (!b) return; scope = b.dataset.k; [...$('segS').children].forEach(x => x.classList.toggle('on', x === b)); render(); };
$('q').oninput = render; $('br').onchange = render; $('reload').onclick = loadLedger;
</script>
</body>
</html>
